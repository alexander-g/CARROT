name: Build Windows Binaries

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false



jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip' # caching pip dependencies

      - name: WORKAROUND UNTIL I HAVE A BETTER SOLUTION
        run: |
          pwd
          ls
          ls carrot_ml
          ls carrot_ml/ultralytics
          cp -r traininglib_/traininglib ./traininglib
          ls traininglib/datalib.py
      
      - name: Install requirements
        run: |
          ./deno.bat task cache
          pip install -r requirements.frozen.txt
        
      - name: Build
        run: python build.py --zip
      
      - name: Archive binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: builds/*.zip
          if-no-files-found: error
  
  
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      
      - name: deno
        run: |
          ./deno.sh task cache
      
      - name: build
        run: |
          ./deno.sh run                                    \
            --config=./deno.jsonc                          \
            --allow-read=./                                \
            --allow-write=./static/                        \
            --unstable-bundle                              \
            --no-prompt                                    \
            --cached-only                                  \
            base/backend/ts/build.ts                       \
            --mode=web                                     \
            --static=./static/                             \
            --srcdirs=frontend/,base/frontend/             \
            --index_tsx=frontend/index.tsx                 \
            --extra_bundle=frontend/lib/carrot_worker.ts   \
            --copy_globs=frontend/css/treerings.css,frontend/favicon.ico,frontend/logo.svg
      
      - name: Archive Build
        uses: actions/upload-artifact@v7
        with:
          name: pagebuild
          path: |
            static/*
          if-no-files-found: error
      


  integration_tests:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v7
        # NOTE: recursive currently required
        with:
          submodules: 'recursive'

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: build/

      - name: Unzip
        shell: bash
        run: |
          ls
          ls build/
          #unzip build/*.zip
          for f in build/*.zip; do unzip -o "$f" -d build/extracted/; done

      - name: Download deno
        run: ./deno.bat task cache_libraries

      - name: Run integration tests
        shell: bash
        run: |
          MAINEXE=$(find build/extracted -name CARROT.exe)
          if [ -z "$MAINEXE" ]; then
            echo "CARROT.exe not found in artifact" >&2
            exit 1
          fi
          # forward slashes to backward slashes
          MAINEXEWINPATH="${MAINEXE//\//\\}"
          CMD="cmd.exe /c ${MAINEXEWINPATH}"
          echo "CMD=${CMD}"
          CMD=$CMD NO_WEBBROWSER=1 ./run_tests_integration.sh

  release:
    if: ${{ github.event.inputs.release == 'true' }}
    needs: integration_tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: build/
      
      - name: Set tag 
        id: set_tag
        run: |
          TAGNAME=v$(date +%F)
          echo $TAGNAME
          echo "TAG=${TAGNAME}" >> $GITHUB_OUTPUT
      
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "build/*.zip"
          prerelease: true
          tag: ${{ steps.set_tag.outputs.TAG }}

